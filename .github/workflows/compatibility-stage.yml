name: Compatibility staging validation
on:
  push:
    branches: [automation/compatibility-engine-validation]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/typed-dataflow-compatibility
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Correct explicit params field construction
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/LabSpace.Tests/TypedExecutionTests.cs')
          p.write_text(p.read_text().replace('LabType.Cluster(new(', 'LabType.Cluster(new TypeField('))
          PY
          git config user.name 'Wiesław Šoltés'
          git config user.email 'wieslawsoltes@users.noreply.github.com'
          git add tests
          if ! git diff --cached --quiet; then git commit -m 'test: disambiguate params type field construction'; git push; fi
      - name: Test executable semantics
        run: dotnet test tests/LabSpace.Tests -c Release --logger 'trx;LogFileName=typed.trx' --results-directory artifacts/tests
      - name: Build desktop integration
        run: |
          python3 scripts/fetch-assets.py
          dotnet build src/LabSpace.App -f net10.0-desktop -c Release -p:LabSpaceDesktopOnly=true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LabSpace-typed-validation
          path: artifacts/tests
