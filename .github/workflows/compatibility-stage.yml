name: Compatibility staging validation
on:
  push:
    branches: [automation/compatibility-engine-validation]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/typed-dataflow-compatibility
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Align gesture conversion API
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/LabSpace.Controls/FrontPanelSurface.cs')
          p.write_text(p.read_text().replace('ValueConversion.Coerce(', 'ValueConversion.Convert('))
          PY
          git config user.name 'Wiesław Šoltés'
          git config user.email 'wieslawsoltes@users.noreply.github.com'
          git add src
          if ! git diff --cached --quiet; then git commit -m 'fix: use typed value conversion in instrument gestures'; git push; fi
      - name: Test executable semantics and routing
        run: dotnet test tests/LabSpace.Tests -c Release --logger 'trx;LogFileName=typed.trx' --results-directory artifacts/tests
      - name: Build desktop integration
        run: |
          python3 scripts/fetch-assets.py
          dotnet build src/LabSpace.App -f net10.0-desktop -c Release -p:LabSpaceDesktopOnly=true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Publish browser and verify native ABI
        run: |
          dotnet workload install wasm-tools --skip-manifest-update
          dotnet publish src/LabSpace.App -f net10.0-browserwasm -c Release -o artifacts/publish -p:WasmShellWebAppBasePath=/LabSpace/
          python3 scripts/check-native-abi.py
          GITHUB_SHA=$(git rev-parse HEAD) python3 scripts/collect-site.py artifacts/publish artifacts/site
      - name: Browser acceptance
        run: |
          npm install --ignore-scripts
          npx playwright install --with-deps chromium
          python3 scripts/serve-site.py --directory artifacts/site --port 4173 > artifacts/server.log 2>&1 &
          npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LabSpace-typed-validation
          path: |
            artifacts/tests
            artifacts/screenshots
            artifacts/test-results
            artifacts/playwright-report
            artifacts/server.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LabSpace-typed-browser
          path: artifacts/site
          include-hidden-files: true
