name: Integrate programming source
on:
  push:
    branches: [feat/structured-programming-parity]
    paths: [.github/workflows/materialize-programming.yml]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/structured-programming-parity
      - name: Apply verified source-only integration patch
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, lzma, pathlib, subprocess
          encoded = ''''''
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '4f9f89b92cb9c48c2c7e0ba8cc47f58e683b418026749113c39fff2bb1902534'
          file = '/tmp/labspace-source.patch'
          pathlib.Path(file).write_bytes(patch)
          paths = subprocess.check_output(['git','apply','--numstat',file], text=True).splitlines()
          assert len(paths) == 19 and all(line.split('\t')[-1].startswith(('src/','tests/')) for line in paths)
          subprocess.run(['git','apply','--check',file],check=True)
          subprocess.run(['git','apply','--index',file],check=True)
          PY
          git config user.name 'LabSpace contributors'
          git config user.email 'wieslawsoltes@users.noreply.github.com'
          git commit -m 'feat: integrate frame programming with editors, rendering, persistence and execution'
          git push origin HEAD:feat/structured-programming-parity
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Compile and test engines
        run: dotnet test tests/LabSpace.Tests -c Release --logger 'trx;LogFileName=engine.trx' --results-directory artifacts/tests
      - name: Compile desktop controls
        if: always()
        run: |
          python3 scripts/fetch-assets.py
          dotnet build src/LabSpace.App -f net10.0-desktop -c Release -p:LabSpaceDesktopOnly=true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: programming-engine-tests
          path: artifacts/tests
