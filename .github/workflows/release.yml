name: Release packages
on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - '.github/workflows/release.yml'
      - 'src/**'
      - 'global.json'
      - 'Directory.Build.props'
  workflow_dispatch:
    inputs:
      version:
        description: Version for a dry run (tags publish; manual runs only build and upload artifacts)
        required: true
        default: '0.3.0-alpha.1'
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
env:
  APP_NAME: LabSpace
  APP_PROJECT: src/LabSpace.App
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: v
        name: Resolve release version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        shell: bash
        run: |
          VERSION="$INPUT_VERSION"
          if [ "$REF_TYPE" = tag ]; then
            VERSION="${REF_NAME#v}"
          elif [ -z "$VERSION" ]; then
            VERSION="$(python3 -c "import xml.etree.ElementTree as E; print(E.parse('Directory.Build.props').find('.//Version').text)")"
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version '$VERSION'" >&2; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  desktop:
    name: Desktop (${{ matrix.rid }})
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, win-arm64, linux-x64, linux-arm64, osx-x64, osx-arm64]
    env:
      VERSION: ${{ needs.version.outputs.version }}
      RID: ${{ matrix.rid }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Fetch font assets
        run: python3 scripts/fetch-assets.py
      - name: Publish self-contained single-file executable
        shell: bash
        run: |
          dotnet publish "$APP_PROJECT" -c Release -f net10.0-desktop -r "$RID" --self-contained true \
            -p:LabSpaceDesktopOnly=true \
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:IncludeAllContentForSelfExtract=true -p:EnableCompressionInSingleFile=true \
            -p:DebugType=none -p:DebugSymbols=false -p:Version="$VERSION" \
            -o "artifacts/desktop/$RID"
      - name: Package executable
        shell: bash
        run: |
          OUT="artifacts/desktop/$RID"
          find "$OUT" -name '*.pdb' -delete
          mkdir -p artifacts/dist
          BASE="$APP_NAME-$VERSION-$RID"
          if [[ "$RID" == win-* ]]; then
            mv "$OUT/$APP_NAME.App.exe" "$OUT/$APP_NAME.exe"
            test "$(find "$OUT" -type f | wc -l)" -eq 1
            (cd "$OUT" && zip -q "$GITHUB_WORKSPACE/artifacts/dist/$BASE.zip" "$APP_NAME.exe")
          else
            mv "$OUT/$APP_NAME.App" "$OUT/$APP_NAME"
            chmod +x "$OUT/$APP_NAME"
            test "$(find "$OUT" -type f | wc -l)" -eq 1
            tar -C "$OUT" -czf "artifacts/dist/$BASE.tar.gz" "$APP_NAME"
          fi
          ls -la artifacts/dist
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.rid }}
          path: artifacts/dist/*
          if-no-files-found: error

  package:
    needs: [version, desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify storage transaction and picker lifecycle
        run: node --test tests/storage/*.test.mjs
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Prepare toolchain
        run: |
          dotnet workload install wasm-tools --skip-manifest-update
          python3 scripts/fetch-assets.py
      - name: Test engines
        run: dotnet test tests/LabSpace.Tests -c Release
      - name: Pack reusable libraries
        run: |
          set -euo pipefail
          for project in src/*/*.csproj; do
            case "$project" in */LabSpace.App/*) continue;; esac
            dotnet pack "$project" -c Release -o artifacts/packages -p:Version="$VERSION"
          done
          test "$(find artifacts/packages -maxdepth 1 -name '*.nupkg' | wc -l)" -eq 9
      - name: Publish browser distribution and verify Skia ABI
        run: |
          dotnet publish src/LabSpace.App -f net10.0-browserwasm -c Release -o artifacts/publish -p:Version="$VERSION" -p:WasmShellWebAppBasePath=/LabSpace/
          python3 scripts/check-native-abi.py
          python3 scripts/collect-site.py artifacts/publish artifacts/site
          cd artifacts/site && zip -qr ../LabSpace-browser.zip .
      - name: Record engine performance baseline
        run: |
          mkdir -p artifacts/benchmarks
          dotnet build tools/LabSpace.Benchmarks -c Release
          dotnet run --project tools/LabSpace.Benchmarks -c Release --no-build -- 1000 > artifacts/benchmarks/engine.json
          python3 -m json.tool artifacts/benchmarks/engine.json
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: artifacts/dist
          merge-multiple: true
      - name: Generate release checksums
        shell: bash
        run: |
          cp artifacts/packages/*.nupkg artifacts/packages/*.snupkg artifacts/LabSpace-browser.zip artifacts/benchmarks/engine.json artifacts/dist/
          (cd artifacts/dist && sha256sum * > SHA256SUMS)
          cat artifacts/dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LabSpace-release
          path: |
            artifacts/packages
            artifacts/LabSpace-browser.zip
            artifacts/benchmarks
            artifacts/dist
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
          if-no-files-found: error
      - name: Publish tagged GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          PRE=()
          case "$VERSION" in *-*) PRE=(--prerelease);; esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/dist/* --clobber
          else
            gh release create "$TAG" artifacts/dist/* --verify-tag --title "LabSpace $TAG" --generate-notes "${PRE[@]}"
          fi

  nuget:
    name: Publish to NuGet.org (Trusted Publishing)
    needs: [version, package]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: nuget
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: packages
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Check NuGet user
        env:
          NUGET_USER: ${{ vars.NUGET_USER || secrets.NUGET_USER }}
        run: test -n "$NUGET_USER" || { echo 'Set the NUGET_USER variable (your nuget.org profile name) for this repository or its nuget environment.' >&2; exit 1; }
      - name: NuGet login (OIDC → short-lived API key)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER || secrets.NUGET_USER }}
      - name: Push packages
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "packages/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
