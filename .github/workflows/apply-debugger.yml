name: Integrate debugger source
on:
  push:
    branches: [feat/advanced-structures-0.3]
    paths: ['.ci-debugger-*.b64', '.github/workflows/apply-debugger.yml']
permissions:
  contents: write
jobs:
  integrate:
    if: github.actor == 'wieslawsoltes'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Verify and apply source delta
        run: |
          python3 - <<'PY'
          import base64, hashlib, lzma, pathlib, subprocess
          root = pathlib.Path('.')
          payload = ''.join((root / f'.ci-debugger-{i}.b64').read_text().strip() for i in range(4))
          delta = lzma.decompress(base64.b64decode(payload, validate=True), memlimit=134217728)
          assert len(delta) == 97690
          assert hashlib.sha256(delta).hexdigest() == '667e971d70615eafcd464025e658a0799b9cb0d55446564c1172debe642c2674'
          parent = subprocess.check_output(['git', 'rev-parse', 'HEAD^'], text=True).strip()
          assert parent == 'b7595d1a8d0a55a1bb7300688a400adae660dec9', parent
          subprocess.run(['git', 'apply', '--check', '--unidiff-zero', '-'], input=delta, check=True)
          subprocess.run(['git', 'apply', '--unidiff-zero', '-'], input=delta, check=True)
          for file in root.glob('.ci-debugger-*.b64'): file.unlink()
          (root / '.github/workflows/apply-debugger.yml').unlink()
          PY
          node --test tests/storage/*.test.mjs
          git diff --check
          git config user.name 'Wiesław Šoltés'
          git config user.email 'wieslawsoltes@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add scoped cross-VI debugger, bounded retained probes and robust browser storage'
          git push origin HEAD:refs/heads/feat/advanced-structures-0.3
